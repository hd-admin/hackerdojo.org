# Items and areas on the Dojo 5.0 fundraising page (/fundraising/, pages/home/fundraising.html).
#
# Prices include 9.75% sales tax (confirmed with CDTFA for 3200 Patrick Henry Drive). Shipping is extra.
# Area and item names become the Every.org "designation" on every money button ("<Area> - <item>", or
# "<Area> - general" for a whole area), which the totals sheet keys on. Don't rename them once donations
# have started; edit prices, notes and links freely.
#
# Each area: name, description, items. Optional: priority (a number: the area as a whole is listed in the
# High priority box in that position), amount and note (shown there), image.
# Each item:
#   name, note (optional, shown under the name)
#   kind: fund     - "Chip in" button; shows `amount` (or TBD). With a `url` it also gets a "View item" button.
#         buy      - "Gift this item" button with `url`, `store` and `price`; without a url it shows "Link coming soon"
#         contact  - "Contact us" button (used items we need to approve first)
#   store: the shop's name. Leave it out for Amazon wishlist links (the button then says "Buy on Amazon").
#   needs: how many (a number, or text such as "3 of 12 needed")
#   coordinate: true  - "Coordinate with us first" chip; the button says "View item" instead of "Gift this item"
#   stretch: true     - "Stretch goal" chip
#   priority: a number - also listed in the High priority box, in that position
#   image: a file in static/images/fundraising/ (for example water.jpg), or icon:<name> for a drawn icon.
#          Icons: router, netswitch, cable, battery, wifi, badge, camera, intercom, couch, bolt, fridge, lock,
#          wall, conftable, tv, cabinet, sink, tables, desk, cubby, plant, paint, stage, led, speaker, office,
#          confroom, booth.

