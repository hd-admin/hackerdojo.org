# docs/ holds planning notes (e.g. docs/auction) that contain example Liquid
# syntax; building them breaks the GitHub Pages build. Setting `exclude`
# replaces Jekyll's default list, so the defaults are repeated here.
exclude:
  - docs
  # pages/ holds partials that the top-level pages include; they aren't pages on their own
  - pages
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CNAME

# /fundraising/ redirects to /donations/ (redirect_from in donations.html); GitHub Pages ships this plugin.
plugins:
  - jekyll-redirect-from

# Move volunteer sign-ups (/volunteer) are sent to this Google Apps Script web app ("Volunteer signups v1"),
# which adds them to the "Hacker Dojo – Move Volunteer Signups" sheet. Leave it empty to fall back to email.
volunteer_signup_url: https://script.google.com/macros/s/AKfycbyWdLS0Irx0dZReGRlIVql82pOY4FLb07oEcZter4EbGFMMNDG_DZUxUQr4x-HbPkM_/exec

# Move questions (the "Ask a question" pop-up on /hackerdojo5/) are sent to this Google Apps Script web app,
# which adds them to the move questions sheet. Leave it empty to fall back to email.
move_question_url: "https://script.google.com/macros/s/AKfycbznG7JfRRelKXFmPapBXwYoEPRInTq-KXDBpaOCvNLdO7VpCDhNUN_mlkD3lztQt1JO/exec"

# Dojo 5.0 fundraising messages (the "Contact us" and "Notify us that you purchased this item" forms on /donations/)
# are sent to this Google Apps Script web app, which adds them to the fundraising messages sheet, saves photos to Drive
# and emails the move team. Leave it empty to fall back to email.
fundraising_message_url: "https://script.google.com/macros/s/AKfycbwUvSN2ON93oSp5WK6cq7jaTc6aSB1H2jNXd9ZQxrg8KJk2JH6rRiUHbMM8xdzXu3pDsQ/exec"

# Live progress for /donations/: totals by designation and purchase counts, served as JSON by the "Dojo 5.0 Donations"
# sheet's script (its web app deployment). Leave it empty and the page shows no progress.
fundraising_progress_url: "https://script.google.com/macros/s/AKfycbw92YK0B8xPbFkh6PH0tIxNq-j1kAzflx2RJaFP9LuvOKk1cV_vtQGETqxuf_kiqnmB/exec"
